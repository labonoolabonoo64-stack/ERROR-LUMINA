name: Build ERROR LUMINA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish --configuration Release --output ./ERROR-LUMINA-Build

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ERROR-LUMINA
          path: ./ERROR-LUMINA-Build/
